---
Name: myproject
---
SilverStripe\Core\Manifest\ModuleManifest:
  project: app

# UTF8MB4 has limited support in older MySQL versions.
# Remove this configuration if you experience issues.
---
Name: myproject-database
---
SilverStripe\ORM\Connect\MySQLDatabase:
  connection_charset: utf8mb4
  connection_collation: utf8mb4_unicode_ci
  charset: utf8mb4
  collation: utf8mb4_unicode_ci

Atwx\ViteHelper\Helper\ViteHelper:
    manifest_path: "/app/client/dist/.vite/manifest.json"  # default
    output_url: "/app/client/dist/"  # default
    editor_css: 'app/client/src/scss/editor.scss'

SilverStripe\Core\Injector\Injector:
  DataListFilter.FulltextBoolean:
    class: App\ORM\FulltextBooleanFilter

SilverStripe\Security\Member:
  extensions:
    - App\Extensions\MemberExtension

App\Tasks\Task:
  extensions:
    - App\History\HistoryExtension

App\Calendar\Appointment:
  extensions:
    - App\History\HistoryExtension

App\Calendar\AppointmentParticipation:
  extensions:
    - App\History\HistoryExtension

App\Food\Meal:
  extensions:
    - App\History\HistoryExtension

App\Food\MealEater:
  extensions:
    - App\History\HistoryExtension

App\Food\MealProductOrder:
  extensions:
    - App\History\HistoryExtension

App\Calendar\AppointmentAgendaPoint:
  extensions:
    - App\History\HistoryExtension

App\Money\MoneyHistory:
  extensions:
    - App\History\HistoryExtension

App\Money\MoneySettlement:
  extensions:
    - App\History\HistoryExtension

App\Money\MoneyAccount:
  extensions:
    - App\History\HistoryExtension

App\Money\MoneyBudget:
  extensions:
    - App\History\HistoryExtension
